<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enjoy the Guitar</title>
  <link rel="stylesheet" href="intro.css" />
  <link href="https://fonts.googleapis.com/css2?family=Anton:wght@400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="intro-wrapper">
    <div class="intro-container">
      <h1>Enjoy the guitar</h1>
      <p class="subtitle">Scegli la tua modalità di gioco</p>
      
      <div class="mode-selection">
        <div class="mode-card" data-mode="corde-vuote" style="--index: 0;">
          <div class="album-cover">
            <img src="assets/guitar.png" alt="Chitarra" />
          </div>
          <h2>CORDE VUOTE</h2>
        </div>
        
        <div class="mode-card" data-mode="canzoni" data-song="deep-purple" style="--index: 1;">
          <div class="album-cover">
            <img src="assets/deep-purple.png" alt="Deep Purple - Smoke on the Water" />
          </div>
          <h2>SMOKE ON THE WATER</h2>
        </div>
        
        <div class="mode-card" data-mode="canzoni" data-song="satisfaction" style="--index: 2;">
          <div class="album-cover">
            <img src="assets/satisfaction.png" alt="Rolling Stones - Satisfaction" />
          </div>
          <h2>SATISFACTION</h2>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    document.querySelectorAll('.mode-card').forEach(card => {
      card.addEventListener('click', function() {
        const mode = this.dataset.mode;
        const song = this.dataset.song;
        
        // Passa alla pagina di gioco con la modalità e canzone selezionata
        if (song) {
          window.location.href = `guitar.html?mode=${mode}&song=${song}`;
        } else {
          window.location.href = `guitar.html?mode=${mode}`;
        }
      });
    });
  </script>
</body>
</html>
